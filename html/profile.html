<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile & Tracking - जनसेतु AI</title>
    
    <!-- Modern Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Favicon -->
    <link rel="icon" type="image/jpeg" href="assets/logohack.jpeg">
    <link rel="shortcut icon" type="image/jpeg" href="assets/logohack.jpeg">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="profile-layout" style="background: #f8fafc;">

    <!-- Navbar (Solid Variation) -->
    <nav class="navbar solid-nav" style="background: rgba(10, 37, 64, 0.95); position: sticky; top: 0; z-index: 1000; box-shadow: 0 4px 10px rgba(0,0,0,0.1);">
        <div class="container nav-container" style="height: 55px; display: flex; justify-content: space-between; align-items: center;">
            <a href="index.html" class="logo" style="color: white; text-decoration: none;">
                <img src="assets/logohack.jpeg" alt="JanSetu AI Logo" class="logo-img" style="height: 35px; border-radius: 4px; margin-right: 10px; vertical-align: middle;">
                <span class="logo-text" style="vertical-align: middle;">जनसेतु AI</span>
            </a>
            <div class="nav-links" style="display: flex; gap: 20px; align-items: center;">
                <a href="index.html" style="color: white; text-decoration: none; font-weight: 600; display: inline-flex; align-items: center; gap: 6px;"><i class="fas fa-home"></i> Home</a>
                <div id="google_translate_element" style="margin: 0 10px;"></div>
                <a href="explore.html" style="color: white; text-decoration: none;">Explore Map</a>
                <a href="#" style="color: white; text-decoration: none;"><i class="fas fa-user-circle"></i> My Profile</a>
                <a href="index.html" class="btn btn-outline" style="color: white; border-color: white; padding: 6px 15px;">Logout</a>
            </div>
        </div>
    </nav>

    <!-- Profile Header Section -->
    <div class="profile-header-container">
        <div class="container profile-header">
            <div class="profile-info">
                <div class="avatar"><i class="fas fa-user"></i></div>
                <div>
                    <h2>Welcome, Citizen!</h2>
                    <p class="phone-display"><i class="fas fa-phone-alt"></i> Verified Mobile: <strong id="user-phone-num">+91 9876543210</strong></p>
                </div>
            </div>
            <div class="profile-stats">
                <div class="stat-box">
                    <h3 id="stat-total">0</h3>
                    <p>Total Complaints</p>
                </div>
                <div class="stat-box active-stat">
                    <h3 id="stat-progress">0</h3>
                    <p>In Progress / Pending</p>
                </div>
                <div class="stat-box resolved-stat">
                    <h3 id="stat-completed">0</h3>
                    <p>Completed</p>
                </div>
            </div>
        </div>
    </div>

    <!-- My Complaints & Tracking -->
    <div class="container" style="margin-top: -30px; margin-bottom: 80px; position: relative; z-index: 10;">
        
        <div class="tracking-toolbar">
            <h2><i class="fas fa-tasks text-primary"></i> My Active Complaints & Live Status</h2>
            <a href="services.html" class="btn btn-primary"><i class="fas fa-plus"></i> New Complaint</a>
        </div>

        <div id="citizen-complaints-list" class="complaints-grid">
            <!-- Dynamic cards rendered by JS script below -->
        </div>
    </div>

    <!-- Notification Simulator JS -->
    <script src="js/notification-simulator.js"></script>

    <!-- Custom Script to Fetch Live Status for Logged-In Phone Number -->
    <script>
        function extractDigits(str) {
            return (str || '').replace(/[^0-9]/g, '').slice(-10);
        }

        async function renderCitizenTracking() {
            const userPhone = localStorage.getItem('userPhone') || '9876543210';
            const userDigits = extractDigits(userPhone);
            const phoneDisplay = document.getElementById('user-phone-num');
            if (phoneDisplay) {
                phoneDisplay.textContent = '+91 ' + (userDigits || '9876543210');
            }

            const listContainer = document.getElementById('citizen-complaints-list');
            let allReports = [];

            try {
                const res = await fetch('/api/reports');
                if (res.ok) {
                    allReports = await res.json();
                } else {
                    allReports = JSON.parse(localStorage.getItem('civic_reports') || '[]');
                }
            } catch (e) {
                allReports = JSON.parse(localStorage.getItem('civic_reports') || '[]');
            }

            // Filter complaints matching this user's phone number (last 10 digits match)
            let userReports = allReports.filter(r => {
                const reportDigits = extractDigits(r.phone);
                return (userDigits && reportDigits && userDigits === reportDigits) || (!r.phone && userDigits === '9876543210');
            });

            // If user hasn't submitted a specific complaint yet, show all community complaints for tracking
            if (userReports.length === 0) {
                userReports = allReports;
            }

            // Update stats
            const statTotal = document.getElementById('stat-total');
            const statProgress = document.getElementById('stat-progress');
            const statCompleted = document.getElementById('stat-completed');

            const completedCount = userReports.filter(r => r.status === 'Completed' || r.status === 'Resolved').length;
            const progressCount = userReports.length - completedCount;

            if (statTotal) statTotal.textContent = userReports.length;
            if (statProgress) statProgress.textContent = progressCount;
            if (statCompleted) statCompleted.textContent = completedCount;

            if (userReports.length === 0) {
                listContainer.innerHTML = `
                    <div style="text-align: center; color: var(--text-muted); padding: 40px 0; grid-column: 1 / -1;">
                        <i class="fas fa-folder-open" style="font-size: 3rem; margin-bottom: 15px; opacity: 0.5;"></i>
                        <p>No complaints submitted yet under mobile number +91 ${userDigits || '9876543210'}.</p>
                    </div>`;
                return;
            }

            let html = '';
            userReports.forEach(report => {
                const status = report.status || 'Pending';
                const isCompleted = status === 'Completed' || status === 'Resolved';
                const isInProgress = status === 'In Progress';
                const isPending = status === 'Pending';

                let badgeHtml = '';
                let cardClass = '';

                if (isCompleted) {
                    badgeHtml = '<span class="status-badge status-resolved" style="background: #dcfce7; color: #15803d;"><i class="fas fa-check-circle"></i> Completed / Resolved</span>';
                    cardClass = 'resolved-card';
                } else if (isInProgress) {
                    badgeHtml = '<span class="status-badge status-progress" style="background: #dbeafe; color: #1e40af;"><i class="fas fa-tools"></i> In Progress</span>';
                } else {
                    badgeHtml = '<span class="status-badge" style="background: #fef3c7; color: #b45309;"><i class="fas fa-clock"></i> Pending Admin Action</span>';
                }

                const dateStr = new Date(report.timestamp).toLocaleDateString();

                html += `
                <div class="complaint-card ${cardClass}" style="border: 1px solid #cbd5e1; border-radius: 12px; padding: 20px; margin-bottom: 20px; background: white; box-shadow: 0 4px 15px rgba(0,0,0,0.05);">
                    <div class="card-header" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
                        ${badgeHtml}
                        <span class="report-id" style="font-weight: 700; color: var(--navy);">ID: ${report.id}</span>
                    </div>
                    <div class="card-body">
                        <h3 class="issue-title" style="margin: 0 0 6px 0; color: var(--navy);">${report.address}</h3>
                        <p class="issue-desc" style="color: var(--text-main); margin-bottom: 10px;">${report.description || 'Civic complaint submitted to NMC.'}</p>
                        <div class="issue-meta" style="font-size: 0.85rem; color: var(--text-muted); display: flex; gap: 15px;">
                            <span><i class="fas fa-calendar-alt"></i> Reported: ${dateStr}</span>
                            <span><i class="fas fa-users"></i> ${report.upvotes || 1} Citizen Support(s)</span>
                        </div>
                    </div>
                    
                    <!-- Real-Time Progress Timeline -->
                    <div class="tracking-timeline" style="display: flex; justify-content: space-between; margin-top: 20px; padding-top: 15px; border-top: 1px solid #e2e8f0;">
                        <div class="timeline-step completed" style="text-align: center;">
                            <div class="step-icon" style="background: #10b981; color: white; width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 5px;"><i class="fas fa-check"></i></div>
                            <p style="font-size: 0.8rem; font-weight: 600; margin: 0;">Submitted</p>
                        </div>
                        <div class="timeline-step ${isInProgress || isCompleted ? 'completed' : ''}" style="text-align: center;">
                            <div class="step-icon" style="background: ${isInProgress || isCompleted ? '#10b981' : '#cbd5e1'}; color: white; width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 5px;"><i class="fas fa-user-shield"></i></div>
                            <p style="font-size: 0.8rem; font-weight: 600; margin: 0;">Assigned</p>
                        </div>
                        <div class="timeline-step ${isInProgress ? 'active' : (isCompleted ? 'completed' : '')}" style="text-align: center;">
                            <div class="step-icon" style="background: ${isInProgress ? '#3b82f6' : (isCompleted ? '#10b981' : '#cbd5e1')}; color: white; width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 5px;"><i class="fas fa-hard-hat"></i></div>
                            <p style="font-size: 0.8rem; font-weight: 600; margin: 0;">In Progress</p>
                        </div>
                        <div class="timeline-step ${isCompleted ? 'completed' : ''}" style="text-align: center;">
                            <div class="step-icon" style="background: ${isCompleted ? '#10b981' : '#cbd5e1'}; color: white; width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 5px;"><i class="fas fa-flag-checkered"></i></div>
                            <p style="font-size: 0.8rem; font-weight: 600; margin: 0;">Completed</p>
                        </div>
                    </div>
                    
                    ${isCompleted ? `
                        <div class="resolution-note" style="margin-top: 15px; padding: 10px 14px; background: #f0fdf4; border: 1px solid #bbf7d0; border-radius: 8px; font-size: 0.9rem; color: #166534;">
                            <p style="margin: 0;"><strong><i class="fas fa-check-double"></i> Resolution Update:</strong> Issue completed and resolved by Nagpur Municipal Corporation Team!</p>
                        </div>` : ''}
                </div>`;
            });

            listContainer.innerHTML = html;
        }

        document.addEventListener('DOMContentLoaded', () => {
            renderCitizenTracking();
            setInterval(renderCitizenTracking, 1500);
        });
    </script>

    <!-- Google Translate Script -->
    <script type="text/javascript">
        function googleTranslateElementInit() {
            new google.translate.TranslateElement({pageLanguage: 'en', includedLanguages: 'en,hi,mr'}, 'google_translate_element');
        }
    </script>
    <script type="text/javascript" src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

</body>
</html>
