<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Report Infrastructure Issue - जनसेतु AI</title>
    
    <!-- Modern Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Favicon -->
    <link rel="icon" type="image/jpeg" href="assets/logohack.jpeg">
    <link rel="shortcut icon" type="image/jpeg" href="assets/logohack.jpeg">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
    
    <!-- Voice AI Speech Engine -->
    <script src="js/voice-ai.js"></script>
    <style>
        .report-container {
            max-width: 600px;
            margin: 100px auto;
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        .form-group {
            margin-bottom: 25px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--navy);
        }
        .form-group input, .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-family: inherit;
        }
        .location-btn {
            background: var(--saffron);
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 10px;
            width: 100%;
            justify-content: center;
        }
        .location-btn:hover { background: #ea580c; }
        
        .photo-upload-box {
            border: 2px dashed #cbd5e1;
            padding: 40px;
            text-align: center;
            border-radius: 8px;
            background: #f8fafc;
            cursor: pointer;
            transition: all 0.2s;
        }
        .photo-upload-box:hover {
            border-color: var(--teal);
            background: #f0fdfa;
        }
        .photo-upload-box i {
            font-size: 3rem;
            color: var(--teal);
            margin-bottom: 10px;
        }
        .photo-preview,
        .video-preview {
            max-width: 100%;
            border-radius: 8px;
            display: none;
            margin-top: 15px;
        }
        .upload-note {
            margin-top: 8px;
            color: var(--text-muted);
            font-size: 0.85rem;
        }
        
        .submit-btn {
            background: var(--navy);
            color: white;
            border: none;
            padding: 15px;
            border-radius: 8px;
            width: 100%;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            margin-top: 20px;
        }
        .submit-btn:hover { background: #0f172a; }
    </style>
</head>
<body class="portal-layout" style="background: #f1f5f9;">

    <!-- Transparent Navbar -->
    <nav class="navbar portal-nav" style="background: var(--navy);">
        <div class="container nav-container">
            <a href="index.html" class="logo">
                <img src="assets/logohack.jpeg" alt="JanSetu AI Logo" class="logo-img">
                <span class="logo-text">जनसेतु AI</span>
            </a>
            <div class="nav-links">
                <a href="index.html" style="font-weight: 600; display: inline-flex; align-items: center; gap: 6px;"><i class="fas fa-home"></i> Home</a>
                <a href="about.html">About Nagpur</a>
                <div id="google_translate_element" style="margin: 0 10px;"></div>
                <a href="login.html" class="btn btn-primary">Login</a>
            </div>
            <button class="mobile-menu-btn"><i class="fas fa-bars"></i></button>
        </div>
    </nav>

    <main class="container">
        <div class="report-container">
            <h2 style="color: var(--navy); margin-bottom: 10px; text-align: center;">Report Infrastructure Issue</h2>
            <p style="text-align: center; color: var(--text-muted); margin-bottom: 30px;">Help us keep Nagpur safe by reporting road, sanitation, or utility issues.</p>
            
            <form id="report-form">
                
                <div class="form-group">
                    <label>1. Location of Issue</label>
                    <input type="text" id="address-input" placeholder="Enter street address or landmark" required>
                    <button type="button" class="location-btn" id="btn-get-location">
                        <i class="fas fa-map-marker-alt"></i> Use My Live Location
                    </button>
                    <p id="location-status" style="font-size: 0.85rem; color: #10b981; margin-top: 8px; display: none;">Location acquired!</p>
                </div>

                <div class="form-group" style="position: relative;">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
                        <label style="margin: 0;">2. Issue Details</label>
                        <button type="button" id="btn-voice-mic" style="background: #2563eb; color: white; border: none; padding: 6px 14px; border-radius: 20px; font-size: 0.82rem; font-weight: 700; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; transition: all 0.2s; box-shadow: 0 2px 8px rgba(37,99,235,0.2);">
                            <i class="fas fa-microphone"></i> <span>Speak (Marathi/Hindi/English)</span>
                        </button>
                    </div>
                    <textarea id="issue-desc" rows="3" placeholder="Describe issue or click mic to speak in Marathi, Hindi, or English..." required></textarea>
                    
                    <div id="voice-ai-badge" style="display: none; margin-top: 8px; padding: 10px 14px; background: #eff6ff; border: 1px solid #bfdbfe; border-radius: 8px; font-size: 0.85rem; color: #1e40af;">
                        <p style="margin: 0; font-weight: 600;"><i class="fas fa-robot" style="color: #2563eb;"></i> JanSetu Voice AI translated your speech to English:</p>
                        <p id="voice-ai-translation" style="margin: 4px 0 0 0; font-style: italic; color: #1e3a8a; font-weight: 500;"></p>
                    </div>
                </div>

                <div class="form-group">
                    <label>3. Upload Photo or Video Evidence</label>
                    
                    <div class="photo-upload-wrapper">
                        <!-- Mobile Controls (Camera + Gallery) -->
                        <div class="upload-mobile-group">
                            <label class="btn-upload-choice btn-upload-camera">
                                <i class="fas fa-camera"></i> Take Photo/Video
                                <input type="file" id="camera-input" accept="image/*,video/*" capture="environment" style="display: none;">
                            </label>
                            <label class="btn-upload-choice btn-upload-gallery">
                                <i class="fas fa-images"></i> Choose from Gallery
                                <input type="file" id="gallery-input" accept="image/*,video/*" style="display: none;">
                            </label>
                        </div>

                        <!-- Desktop Controls (Upload from File / Dropzone) -->
                        <div class="upload-desktop-group">
                            <label class="desktop-upload-dropzone">
                                <i class="fas fa-cloud-upload-alt"></i>
                                <p>Click to upload evidence file from computer</p>
                                <span>Supports images and videos (Max 50MB)</span>
                                <input type="file" id="desktop-file-input" accept="image/*,video/*" style="display: none;">
                            </label>
                        </div>

                        <p class="upload-note" id="media-status">No evidence selected yet.</p>
                        <img id="photo-preview" class="photo-preview" alt="Preview" style="max-width: 100%; border-radius: 8px; display: none; margin-top: 15px;">
                        <video id="video-preview" class="video-preview" controls style="max-width: 100%; border-radius: 8px; display: none; margin-top: 15px;"></video>
                    </div>
                </div>

                <button type="submit" class="submit-btn">Submit Report</button>
            </form>
        </div>
    </main>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-storage-compat.js"></script>
    <script src="js/firebase-config.js"></script>

    <!-- Custom JS -->
    <script src="js/report.js"></script>

    <!-- Google Translate Script -->
    <script type="text/javascript">
        function googleTranslateElementInit() {
            new google.translate.TranslateElement({pageLanguage: 'en', includedLanguages: 'en,hi,mr'}, 'google_translate_element');
        }
    </script>
    <script type="text/javascript" src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
</body>
</html>
